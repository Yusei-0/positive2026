<ion-content [fullscreen]="true" class="ion-no-border">
  <div id="capture-container" class="content-wrapper">
    <!-- Background is part of capture -->
    <div class="background-container">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blur-overlay"></div>
    </div>

    <div class="main-container">
      <div class="header-section">
        <h3>Positive 2026</h3>
        <p>Tu dosis diaria de inspiración</p>
      </div>

      <div class="quote-section">
        <ng-container *ngIf="!loading; else loaderTemplate">
          <div class="quote-card animate-pop-in">
            <div class="quote-icon">
              <ion-icon name="heart-outline"></ion-icon>
            </div>
            <h1 class="quote-text">
              {{ quote }}
            </h1>
            <p class="quote-author">{{ author }}</p>

            <div class="divider"></div>

            <!-- Buttons -->
            <div class="actions exclude-from-capture">
              <ion-button fill="clear" color="dark" (click)="shareImage()" class="action-btn">
                <ion-icon slot="icon-only" name="share-social-outline"></ion-icon>
              </ion-button>
              <ion-button fill="clear" color="dark" (click)="copyImage()" class="action-btn">
                <ion-icon slot="icon-only" name="copy-outline"></ion-icon>
              </ion-button>
            </div>
          </div>
        </ng-container>

        <ng-template #loaderTemplate>
          <div class="loader-wrapper">
            <ion-spinner name="bubbles" color="dark"></ion-spinner>
            <p>Buscando inspiración...</p>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <ion-toast [isOpen]="isToastOpen" [message]="toastMessage" [duration]="2000" (didDismiss)="isToastOpen = false"
    position="bottom" color="dark"></ion-toast>
</ion-content>
